name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: pip install --no-cache-dir -r requirements.txt pytest pytest-cov pytest-mock pylint
      - name: pytest with coverage
        run: |
          python3 -m pytest tests/ -q \
            --cov=. --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Lint
        run: python3 -m pylint setup.py tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@v7
      - name: Install deps + generate coverage
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir -r requirements.txt pytest pytest-cov pytest-mock cyclonedx-bom
          # No `|| true`, and the xunit report is regenerated here rather
          # than read from a stale committed file. When this swallowed its
          # own failure, a failed run left no coverage.xml behind and the
          # scan proceeded without it -- SonarQube then recorded no coverage
          # metric at all, which passes any coverage threshold, because a
          # condition whose metric is absent is skipped rather than failed.
          python3 -m pytest tests/ -q \
            --cov=. --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      # The build path every fontem image takes: push by digest, sign through
      # Vault, attest a CycloneDX SBOM and SLSA provenance. This job used to
      # build and sign by hand, with the org cosign key and no SBOM or
      # provenance. Not deployed anywhere today; nothing else changes.
      - name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/edgar-data-fetcher
          vault-role-id: ${{ secrets.VAULT_SIGNER_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SIGNER_SECRET_ID }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
